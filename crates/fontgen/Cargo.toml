description = "GNU Unifont の .hex から firmware 埋め込み用のビットマップフォントを生成する"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# crates.io に publish しない。cargo-deny の path 依存の扱いにも関係する (deny.toml)。
publish = false

# .hex 形式は行単位のテキストであり、外部 crate を必要としない。
[dependencies]
